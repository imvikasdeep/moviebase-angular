<app-container-wrapper>

    <app-heading [heading]="'upcoming'"></app-heading>

    <div class="cards-wrapper">
        @for (movie of movieList; track movie) {
        <app-movie-card [movie]="movie"></app-movie-card>
        }
    </div>
    <div class="pagination">
        <button (click)="updateParam(params.page - 1)" class="button" type="button">Prev</button>
        <button (click)="updateParam(params.page + 1)" class="button" type="button">Next</button>
    </div>

</app-container-wrapper>
